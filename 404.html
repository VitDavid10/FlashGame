<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found — PillWars</title>
    <!-- Served by the server with a 404 status for any address that does not
         exist (see no404 in server/index.js). Absolute paths, because the same
         page shows up at /anything and at /a/b/c. -->
    <meta name="robots" content="noindex">
    <link rel="icon" href="/img/web.png">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <style>
        /* Self-hosted font (/fonts), not Google Fonts. */
        @font-face{font-family:'Press Start 2P';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/press-start-2p-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}
        @font-face{font-family:'Press Start 2P';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/press-start-2p-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
        :root { --primary: #00ff88; }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        /* Arena floor: the same grid as in a match (100px tile, 4px line). */
        body {
            margin: 0; background: #050505; color: #cfe9dd; font-family: 'Press Start 2P', monospace;
            background-image: linear-gradient(rgba(255,255,255,0.03) 4px, transparent 4px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 4px, transparent 4px);
            background-size: 100px 100px;
            display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center;
        }
        main { padding: 32px 20px 40px; width: 100%; max-width: 720px; }
        .logo { display: block; width: min(420px, 78vw); height: auto; margin: 0 auto; }
        /* Same neon as THE CRYPTO ARENA on the landing page (.hero-sub). */
        .code {
            font-size: clamp(56px, 14vw, 104px); line-height: 1; letter-spacing: 8px; margin: 22px 0 18px;
            color: #aaffdd; text-shadow: 0 0 6px var(--primary), 0 0 14px var(--primary), 0 0 26px rgba(0,255,136,0.7);
        }
        h1 { font-size: clamp(13px, 3vw, 18px); font-weight: normal; letter-spacing: 2px; color: #fff; margin: 0 0 14px; text-shadow: 3px 3px 0 rgba(0,0,0,0.7); }
        p { font-size: 10px; line-height: 1.9; color: #9aa1a9; margin: 0 auto 18px; max-width: 460px; }
        .food { display: block; width: min(480px, 86vw); height: auto; margin: 0 auto 22px; image-rendering: pixelated; }
        /* Red button from the game menu (PLAY), with the label drawn by CSS like there. */
        .play {
            display: flex; align-items: center; justify-content: center; margin: 0 auto 18px;
            width: min(360px, 80vw); aspect-ratio: 5.5 / 1; text-decoration: none;
            background: transparent url('/game/img/cartel-hero/btn-plain-red.png') center / 100% 100% no-repeat;
            image-rendering: pixelated; font-size: 18px; color: #fff; text-shadow: 2px 2px 0 rgba(0,0,0,0.65);
        }
        .play:hover { filter: brightness(1.15); }
        .play:active { transform: translate(2px, 2px); }
        /* Gold box of MODES/SKINS on the landing page (.hero-sub-link). */
        .home {
            display: inline-block; font-size: 11px; letter-spacing: 1px; color: #ffce3d; text-decoration: none;
            padding: 9px 14px; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,206,61,0.4); border-radius: 8px;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.75);
        }
        .home:hover { color: #fff; border-color: rgba(255,206,61,0.75); text-shadow: 0 0 10px rgba(255,206,61,0.9), 2px 2px 0 rgba(0,0,0,0.75); }
    </style>
</head>
<body>
    <main>
        <img class="logo" src="/img/pixel-hero/hero-title.png" alt="PILLWARS">
        <div class="code" aria-hidden="true">404</div>
        <h1>THIS PAGE GOT EATEN</h1>
        <p>The link is broken or the page moved. The arena is still open.</p>
        <img class="food" src="/img/404.png" alt="" width="480" height="192">
        <a class="play" href="/game/">PLAY NOW</a>
        <a class="home" href="/">BACK TO HOME</a>
    </main>
</body>
</html>
