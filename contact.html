<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — PillWars</title>
    <link rel="canonical" href="https://pillwars.fun/contact.html">
    <meta name="description" content="Questions, bug reports or a cheater to report? Contact the PillWars team through the contact form.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="PillWars">
    <meta property="og:url" content="https://pillwars.fun/contact.html">
    <meta property="og:title" content="Contact — PillWars">
    <meta property="og:description" content="Questions, bug reports or a cheater to report? Contact the PillWars team through the contact form.">
    <meta property="og:image" content="https://pillwars.fun/img/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="PILLWARS, The Crypto Arena: the logo over the game arena, with pixel-art pills, food and viruses">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@pillwarsdotfun">
    <link rel="icon" href="img/web.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/info.css">
    <script src="/info.js"></script>
</head>
<body>
    <header class="top">
        <a class="brand" href="/" aria-label="PillWars home">
            <span class="logo-pill" aria-hidden="true"></span>
            <img class="brand-img" src="/img/pixel-hero/brand.png" alt="PILLWARS">
        </a>
        <div class="play-area">
            <a class="btn-play" href="/game/?heroplay=1&amp;name=">PLAY NOW</a>
            <div class="play-menu">
                <div class="play-menu-box">
                    <a href="/game/">MODES</a>
                    <a href="/game/?heroskins=1">SKINS</a>
                </div>
            </div>
        </div>
    </header>

    <main class="wrap" style="max-width:640px">
        <h1>CONTACT</h1>
        <p class="intro" style="margin-top:22px">Got a question, a bug, or want to report a cheater? Drop us a line.</p>

        <section class="panel">
            <form id="cform">
                <input type="hidden" name="access_key" value="b1cc038d-5769-4172-b3a7-113eed9f3640">
                <input type="hidden" name="subject" value="New message from pillwars.fun">
                <input type="checkbox" name="botcheck" style="display:none">

                <label for="name" style="margin-top:0">YOUR NAME</label>
                <input type="text" id="name" name="name" required maxlength="80" placeholder="What's your name">

                <label for="email">YOUR EMAIL</label>
                <input type="email" id="email" name="email" required placeholder="So we can reply">

                <label for="message">MESSAGE</label>
                <textarea id="message" name="message" required maxlength="2000" placeholder="Tell us..."></textarea>

                <button type="submit" id="cbtn" class="btn big">SEND MESSAGE</button>
                <div id="cstatus" style="margin-top:14px; min-height:28px; text-align:center"></div>
            </form>
        </section>

        <a class="back bottom" href="/">← BACK TO PILLWARS</a>
    </main>

    <script>
        const form = document.getElementById('cform');
        const status = document.getElementById('cstatus');
        const btn = document.getElementById('cbtn');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true; status.style.color = 'var(--muted)'; status.textContent = 'Sending...';
            try {
                const res = await fetch('https://api.web3forms.com/submit', { method: 'POST', body: new FormData(form) });
                const data = await res.json();
                if (data.success) {
                    status.style.color = 'var(--mint)'; status.textContent = 'Message sent! We\'ll get back to you soon.';
                    form.reset();
                } else {
                    status.style.color = 'var(--red)'; status.textContent = 'Could not send it. Please try again in a minute.';
                }
            } catch (err) {
                status.style.color = 'var(--red)'; status.textContent = 'Connection error. Please try again in a minute.';
            }
            btn.disabled = false;
        });
    </script>
</body>
</html>
