<!doctype html>
<meta charset="utf-8">
<title>Bocetos ROOMS</title>
<style>
@font-face{font-family:'Press Start 2P';src:url(../../../fonts/press-start-2p-latin.woff2)}
@font-face{font-family:'Russo One';src:url(../../../fonts/russo-one-latin.woff2)}
@font-face{font-family:'VT323';src:url(../../../fonts/vt323-latin.woff2)}
*{box-sizing:border-box}
body{margin:0;background:#0b0f05;color:#fff;font-family:'Press Start 2P',monospace;padding:20px;display:flex;flex-direction:column;gap:26px;width:1100px}
h2{font-size:12px;margin:0 0 8px;color:#c8ff00;letter-spacing:.1em}
h2 span{color:#7d8a82;font-size:9px}
.pnl{width:1060px;padding:22px 26px 20px;background:#0f2a1c;border:6px solid #6f8a00;box-shadow:0 0 0 3px #1c2a00,6px 8px 0 rgba(0,0,0,.6);font-size:16px;position:relative}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.ph .w{font-family:'Russo One';font-size:20px;letter-spacing:.14em}.ph .w b{color:#c8ff00;font-weight:400;margin-right:10px}
.ph .on{margin-left:auto;font-family:'Russo One';font-size:14px;color:#c8ff00}
.ph .x{font-family:'Russo One';font-size:12px;padding:8px 16px;border:3px solid #2c3630;color:#7d8a82}
.g{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.c{padding:14px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;position:relative}
.p{font-size:22px;text-shadow:3px 3px 0 #000}
.ly{font-family:'VT323';font-size:19px;color:#cfdad3;display:flex;gap:6px;align-items:center}.ly i{width:8px;height:8px;display:inline-block}
.mo{font-size:6px;color:#8fa096;letter-spacing:.06em}.st{font-family:'VT323';font-size:19px}
.b{display:grid;grid-template-columns:1fr 1.18fr;gap:14px;margin-top:18px}
.bx{position:relative;padding:20px 14px 8px;min-width:0}.bx>b{position:absolute;left:12px;top:0;transform:translateY(-58%);font-weight:400;font-size:8px;letter-spacing:.1em;padding:6px 10px 5px;color:#0b0f05;box-shadow:0 0 0 3px #000;white-space:nowrap}
.r{display:flex;justify-content:space-between;font-size:9px;padding:8px 0;border-bottom:2px dashed rgba(255,255,255,.12);color:#9fb0a6}.r:last-child{border:0}.r span{color:#fff}
.n{display:flex;gap:10px;align-items:center;font-size:8px;line-height:1.6;padding:6px 0}.n i{font-style:normal;padding:4px 7px 3px;color:#0b0f05}
/* colores del menu: pill, arenas, store, quests, friends */
.c0{--k:#8a948e}.c1{--k:#c8ff00}.c2{--k:#3fc4ff}.c3{--k:#b57bff}.c4{--k:#ffc83a}.c5{--k:#ff5a4a}
.ly i.g{background:#00ff88}.ly i.y{background:#ffce3d}.ly i.r{background:#ff5a4e}.ly i.e{background:#56635b}
/* A: barras del menu, cada precio con su color (degradado hacia el color + franja a la derecha) */
.A .c{background:linear-gradient(90deg,#14180a 0,#14180a 40%,color-mix(in srgb,var(--k) 24%,#000) 100%);border:3px solid color-mix(in srgb,var(--k) 38%,#000);border-right:9px solid var(--k);box-shadow:4px 5px 0 rgba(0,0,0,.55)}
.A .c .p{color:var(--k)}.A .c.sel{outline:3px solid var(--k);outline-offset:2px}
.A .bx{background:#0a1a10;border:3px solid color-mix(in srgb,var(--k) 55%,#000);border-left:9px solid var(--k)}.A .bx>b{background:var(--k)}.A .n i{background:var(--k)}
/* B: cabecera de color solida (como las etiquetas SYSTEM/ARENA) y cuerpo oscuro */
.B .c{background:#0a1a10;border:3px solid #1d3a28;padding-top:0;overflow:hidden;box-shadow:4px 5px 0 rgba(0,0,0,.55)}
.B .c .p{align-self:stretch;text-align:center;background:var(--k);color:#0b0f05;text-shadow:none;padding:10px 0 8px;margin-bottom:2px}
.B .c.sel{border-color:var(--k);box-shadow:0 0 0 3px #000,0 0 18px color-mix(in srgb,var(--k) 55%,transparent)}
.B .bx{background:#0a1a10;border:3px solid color-mix(in srgb,var(--k) 55%,#000)}.B .bx>b{background:var(--k)}.B .n i{background:var(--k)}
/* C: tarjetas claras tipo "ticket" pixel: fondo del color, texto negro, la elegida sube */
.C .c{background:color-mix(in srgb,var(--k) 82%,#fff);color:#0b0f05;border:3px solid #000;box-shadow:4px 5px 0 #000}
.C .c .p{color:#0b0f05;text-shadow:2px 2px 0 rgba(255,255,255,.35)}.C .c .ly,.C .c .mo,.C .c .st{color:#0b0f05}
.C .c.sel{transform:translateY(-6px);box-shadow:4px 11px 0 #000}
.C .bx{background:#0a1a10;border:3px solid var(--k)}.C .bx>b{background:var(--k)}.C .n i{background:var(--k)}
.C .c .st{color:#0b0f05!important}.c0 .p{font-size:13px}
.C .c .ly i.e{background:#0b0f05;opacity:.45}
</style>
<h2>BOCETOS ROOMS <span>— misma estructura (tarjetas con layers, ROOM INFO, RULES); solo cambia el color. La elegida es FREE (#c8ff00).</span></h2>
<div id="out"></div>
<script>
const P=[['OFFLINE','c0',null],['FREE','c1',[['L1','g','18/35'],['L2','y','3/35'],['L3','g','33/35']]],['$2','c2',[['L1','g','9/35'],['L2','e','0/35']]],['$5','c3',[['L1','y','7/35']]],['$10','c4',[['L1','e','0/35']]],['$20','c5',[['L1','e','0/35']]]];
const col=['c1','c1','c1'];
function panel(v,t){
  const cards=P.map(([n,c,ly],i)=>`<div class="c ${c}${i===1?' sel':''}"><div class="p">${n}</div>`+(ly?ly.map(l=>`<div class="ly"><span>${l[0]}</span><i class="${l[1]}"></i>${l[2]}</div>`).join('')+(ly.length<2?'<div class="mo">UP TO 4 LAYERS</div>':''):'<div class="mo">VS BOTS</div>')+`<div class="st" style="color:${ly&&i<4?'#00ff88':'#ffd23a'}">${ly&&i<4?'LIVE':i?'WAITING':'PRACTICE'}</div></div>`).join('');
  return `<div><h2>${v} <span>${t}</span></h2><div class="pnl ${v[0]}"><div class="ph"><span class="w"><b>ARCADE</b>ROOMS</span><span class="on">70 ONLINE</span><span class="x">CLOSE</span></div><div class="g">${cards}</div>
  <div class="b c1"><div class="bx"><b>ROOM INFO · FREE · L3</b><div class="r">ENTRY<span>FREE</span></div><div class="r">PLAYERS<span>33/35</span></div><div class="r">STATUS<span style="color:#00ff88">IN GAME</span></div><div class="r">PRIZE<span>TOP 10</span></div></div>
  <div class="bx"><b>RULES</b><div class="n"><i>01</i>DRAFT A SKILL EVERY 30S</div><div class="n"><i>02</i>EAT, SPLIT AND SURVIVE</div><div class="n"><i>03</i>TOP PLAYERS SPLIT THE POT</div><div class="n"><i>04</i>PAID ROOMS TAKE THE ENTRY FROM YOUR IN-GAME $PILLY</div></div></div></div></div>`;
}
document.getElementById('out').innerHTML=panel('A','barras del menú: degradado hacia el color de cada precio + franja a la derecha')+panel('B','cabecera de color sólida como las etiquetas SYSTEM/ARENA')+panel('C','tarjetas claras de color, la elegida sube (ticket pixel)');
document.getElementById('out').style.cssText='display:flex;flex-direction:column;gap:30px';
</script>
