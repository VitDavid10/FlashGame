<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PillWars — editor de carteles</title>
<style>
  :root { --ok:#00ff88; --no:#ff5b5b; --line:#233029; }
  * { box-sizing: border-box; }
  body { margin:0; background:#0b0f0d; color:#dfe6e2; font:13px/1.5 system-ui,sans-serif; display:flex; height:100vh; overflow:hidden; }

  aside { width:250px; flex:none; background:#0f1512; border-right:1px solid var(--line); padding:14px; overflow-y:auto; }
  h1 { font-size:14px; margin:0 0 3px; letter-spacing:1px; }
  p.sub { font-size:11px; color:#7d8a84; margin:0 0 12px; }
  h2 { font-size:10px; text-transform:uppercase; letter-spacing:2px; color:#7d8a84; margin:15px 0 6px; border-bottom:1px solid var(--line); padding-bottom:4px; }
  button.t { display:block; width:100%; text-align:left; margin:0 0 4px; padding:6px 9px; border:1px solid #2a3a33;
             background:#141b18; color:#dfe6e2; font:600 11px/1.25 monospace; letter-spacing:.4px; cursor:pointer; border-radius:3px; }
  button.t:hover { border-color:#3d5b4e; }
  button.t.on { border-color:var(--ok); background:#12251c; color:var(--ok); }
  .dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:6px; vertical-align:1px; }
  .dot.no { background:var(--no); } .dot.ok { background:var(--ok); }

  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .bar { padding:8px 14px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .bar .hint { font-size:11px; color:#7d8a84; margin-right:auto; }
  .bar button { padding:6px 13px; border:1px solid #2a3a33; background:#141b18; color:#dfe6e2; font:600 11px monospace;
                letter-spacing:1px; cursor:pointer; border-radius:3px; }
  .bar button.save { border-color:var(--ok); color:var(--ok); }
  .bar button:hover { border-color:#3d5b4e; }
  #estado { font-size:11px; color:#7d8a84; }
  .stage { flex:1; position:relative; overflow:hidden; background:#000; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }

  #loginOverlay { position:fixed; inset:0; background:#0b0f0d; display:flex; align-items:center; justify-content:center; z-index:999; flex-direction:column; gap:10px; }
  #loginOverlay .card { width:220px; text-align:center; }
  #loginOverlay h1 { font-size:13px; margin-bottom:14px; }
  #loginOverlay input { width:100%; box-sizing:border-box; padding:8px 10px; background:#141b18; border:1px solid #2a3a33; color:#dfe6e2; font:13px monospace; border-radius:3px; text-align:center; letter-spacing:2px; }
  #loginOverlay input:focus { outline:none; border-color:#3d5b4e; }
  #loginOverlay button { width:100%; margin-top:8px; padding:8px; border:1px solid var(--ok); background:#12251c; color:var(--ok); font:600 11px monospace; letter-spacing:1px; cursor:pointer; border-radius:3px; }
  #loginOverlay button:hover { background:#173629; }
  #loginError { font-size:11px; color:var(--no); min-height:14px; margin-top:6px; }
</style>
</head>
<body>
<div id="loginOverlay">
  <div class="card">
    <h1>Editor de carteles — clave de admin</h1>
    <input id="adminKeyInput" type="password" placeholder="····" maxlength="32" autocomplete="off" onkeydown="if(event.key==='Enter')desbloquear()">
    <button onclick="desbloquear()">Unlock</button>
    <div id="loginError"></div>
  </div>
</div>

<aside style="display:none" id="asideApp">
  <h1>Editor de carteles</h1>
  <p class="sub">Click = abrir/cerrar.<br>Puedes tener los que quieras a la vez.</p>
  <div id="lista"></div>
</aside>

<main style="display:none" id="mainApp">
  <div class="bar">
    <span class="hint">
      Arrastra el <b>cartel</b> para moverlo · Arrastra <b>titulo / texto / botones</b> para colocarlos ·
      <b>Rueda</b> encima = tamano · <b>Doble click</b> = reset de esa pieza
    </span>
    <button class="save" onclick="guardar()">GUARDAR</button>
    <button onclick="resetTodo()">RESET TODO</button>
    <button onclick="cerrarTodos()">CERRAR TODOS</button>
    <span id="estado">cargando el juego...</span>
  </div>
  <div class="stage"><iframe id="game" src="game/index.html"></iframe></div>
</main>

<script>
let ADMIN_KEY = '';
function desbloquear() {
  const v = document.getElementById('adminKeyInput').value;
  if (!v) { document.getElementById('loginError').textContent = 'Introduce la clave'; return; }
  ADMIN_KEY = v;
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('asideApp').style.display = 'block';
  document.getElementById('mainApp').style.display = 'flex';
}
</script>
<script>
/*
 * Editor de carteles. Los pop-ups se editan como CLONES dentro del iframe:
 *
 *  - Clones y no los originales porque el juego tiene UN solo #sysModal en el
 *    DOM; para ver 13 avisos a la vez no hay otra. De paso los clones no llevan
 *    listeners, asi que ningun boton puede disparar logica del juego.
 *  - Dentro del iframe y no aqui porque asi heredan todo el CSS del juego
 *    (pixel-pack, marcos horneados, fuentes) y se ven exactamente igual.
 *  - En una capa propia a pantalla completa: las reglas del juego (un cartel a
 *    la vez, posicion centrada fija) no pintan nada en un editor.
 *
 * Lo que se guarda de cada cartel es {title|desc|actions: {x, y, s}} — mismo
 * esquema que el editor de layout del menu. La posicion de la FICHA en el
 * lienzo es solo del editor y vive en localStorage, no viaja al juego.
 */

const CASOS = [
  { g:'Sistema · avisos', n:'NOTICE',               sup:'sysModal', art:1, sys:['Something happened. This is the default system notice.','NOTICE'] },

  { g:'Sistema · avisos', n:'INSUFFICIENT BALANCE', sup:'sysModal', art:1, sys:['Not enough in-GAME balance. Entry costs 50,000 $PILL and you have 12,500. Use the DEPOSIT button to add more.','INSUFFICIENT BALANCE'] },
  { g:'Sistema · avisos', n:'CONNECTION FAILED',    sup:'sysModal', art:1, sys:["Couldn't connect to the server. Please try again in a moment.",'CONNECTION FAILED'] },
  { g:'Sistema · avisos', n:'WALLET',               sup:'sysModal', art:1, sys:['Wallet module not loaded yet.','WALLET'] },
  { g:'Sistema · avisos', n:'KICKED',               sup:'sysModal', art:1, sys:['You were kicked. Wait 30 seconds before rejoining.','KICKED'] },

  { g:'Sistema · avisos', n:'WALLET REQUIRED',      sup:'sysModal', art:1, sys:['Connect your wallet first on the home page, then come back to play paid rooms.','WALLET REQUIRED'] },
  { g:'Sistema · avisos', n:'CONNECT ERROR',        sup:'sysModal', art:1, sys:['Phantom is not installed. Install it or pick another wallet.','CONNECT ERROR'] },

  { g:'Sistema · avisos', n:'PAYMENT CANCELLED',    sup:'sysModal', art:1, sys:['You must sign the entry payment to join a paid room.','PAYMENT CANCELLED'] },
  { g:'Sistema · avisos', n:'LEAVE ARENA?',         sup:'exitModal', art:1, exit:['You are about to leave the arena.<br>Are you sure?', 'LEAVE ARENA?', 'leave-arena', 'EXIT'] },

  { g:'Sistema · avisos', n:'LEAVE LOBBY?',         sup:'exitModal', art:1, exit:["The match has not started yet.<br><span style='color:#00ff88; font-weight:bold;'>Your entry will be refunded to your in-game balance.</span>", 'LEAVE LOBBY?', 'leave-lobby', 'LEAVE'] },
  { g:'Sistema · avisos', n:'WARNING: FORFEIT?',    sup:'exitModal', art:1, exit:["You will lose <span style='color:#ff2a2a'>100% of the PILLS</span> used to enter (they go to the prize pot).<br>Are you sure?", 'WARNING: FORFEIT?', 'warning', 'EXIT NOW'] },
  { g:'Sistema · avisos', n:'SECURE CASHOUT',       sup:'exitModal', art:1, exit:['You have <span style="color:#fff">2 Kills</span>.<br><span style="color:#00ff88; font-weight:bold;">BEST EXIT: 10% FEE (2+ kills)</span><br>Stand still for 5s to CASHOUT safely.<br><span style="font-size:10px; color:#888;">(Your carry will be paid to your in-game balance; the fee goes to the pot)</span>', 'SECURE CASHOUT', 'secure-cashout', 'START CASHOUT (5s)'] },

  // Todos llevan TRY AGAIN (tambien offline desde jul-2026). `st` es el estado
  // de partida que se le pasa a cartelDevResultText(): el texto bajo el titulo
  // lo pinta la MISMA textoResultado() del juego, asi el editor no puede mentir.
  // GAME OVER solo tiene dos formas: de pago (kills + lo que pierdes) y
  // Free/offline (solo kills). Classic y arcade se ven IGUAL — cambia de donde
  // sale la cantidad (carry vs entrada), no el cartel. El AJUSTE es el mismo

  // distinguir: mover uno mueve el otro, a proposito.
  { g:'Fin de partida', n:'GAME OVER · PAGO',         sup:'resultOverlay', art:1, show:'resultOverlay', res:['gameOver','GAME OVER','#ff2a2a'],
    st:{ tipo:'gameOver', mode:'classic', server:'5$', kills:3, carry:12000 } },
  { g:'Fin de partida', n:'GAME OVER · FREE/OFFLINE', sup:'resultOverlay', art:1, show:'resultOverlay', res:['gameOver','GAME OVER','#ff2a2a'],
    st:{ tipo:'gameOver', mode:'classic', server:'Free', kills:3 } },
  { g:'Fin de partida', n:'MATCH FINISHED', sup:'resultOverlay', art:1, show:'resultOverlay', res:['matchFinished','MATCH FINISHED','#00ff88'],
    st:{ tipo:'matchFinished', mode:'classic', server:'Free', kills:3 } },
  { g:'Fin de partida', n:'ROOM RESTARTED', sup:'resultOverlay', art:1, show:'resultOverlay', res:['roomRestarted','ROOM RESTARTED','#ffcc00'],
    st:{ tipo:'roomRestarted', mode:'classic', server:'5$', kills:0, extra:{ refunded:5000 } } },
  // Los datos son los MISMOS campos que manda el servidor en el mensaje
  // 'prize' (ver room-loop.js y cashoutAlSalir): sin kills/feePct/fee el
  // cartel salia con "undefined kills · undefined% exit fee" y no se parecia
  // al de verdad. VICTORY se lleva el carry ENTERO, sin fee.
  { g:'Fin de partida', n:'VICTORY!',       sup:'prizeModal', art:1, prize:{ reason:'victory',  amount:250000, carry:250000 } },
  { g:'Fin de partida', n:'CASHOUT',        sup:'prizeModal', art:1, prize:{ reason:'cashout',  amount:40000,  carry:50000, kills:1, feePct:20, fee:10000 } },
  { g:'Fin de partida', n:'MATCH ENDED',    sup:'prizeModal', art:1, prize:{ reason:'arcadeEnd', myAmount:120000, pot:500000, top:[
    { pos:1, name:'CryptoKid',     pct:25, amount:125000 },
    { pos:2, name:'xX_Reaper_Xx',  pct:19, amount:95000  },
    { pos:3, name:'You',           pct:24, amount:120000, mine:true },
    { pos:4, name:'MoonPill',      pct:11, amount:55000  },
    { pos:5, name:'DegenDave',     pct:7,  amount:35000  },
    { pos:6, name:'satoshi_fan',   pct:5,  amount:25000  },
    { pos:7, name:'PillPusher99',  pct:3,  amount:15000  },
    { pos:8, name:'nova_gg',       pct:2,  amount:10000  },
    { pos:9, name:'zenon',         pct:2,  amount:10000  },
    { pos:10, name:'RektRoyalty',  pct:2,  amount:10000  },
  ] } },
  { g:'Fin de partida', n:'SELECT A SKILL', sup:'skillChoiceOverlay', art:0, show:'skillChoiceOverlay' },

  { g:'Wallet', n:'DEPOSIT',        sup:'gameDepositModal',  art:0, show:'gameDepositModal' },
  { g:'Wallet', n:'WITHDRAW',       sup:'gameWithdrawModal', art:0, show:'gameWithdrawModal' },
  { g:'Wallet', n:'CONNECT WALLET', sup:'walletPickerModal', art:1, show:'walletPickerModal' },

  // --- SKINS (llegaron con la tienda de pildoras de pais) ---
  // Los dos fallos van con el marco GRIS y el OK gris, como los de cartera:
  // showSystemMsg los tiene en su lista `gray`.
  { g:'Skins', n:'SKINS · fallo',   sup:'sysModal', art:1, sys:['You already own that skin.','SKINS'] },
  { g:'Skins', n:'CONVERT · fallo', sup:'sysModal', art:1, sys:['Not enough $PILL in GAME to convert that amount.','CONVERT'] },
  // El cartel de la descripcion. Se afina UNA vez y vale para las 32 skins: el
  // contenido es el mismo y solo cambian los textos. Las dos entradas son EL
  // MISMO cartel con distinto marco (gris de siempre / verde alto), para ver
  // cual queda mejor; comparten clave, asi que colocar uno coloca el otro.
  { g:'Skins', n:'SKIN · descripcion',        sup:'paisModal', art:1, pais:['ES',''] },
  { g:'Skins', n:'SKIN · descripcion V2 verde', sup:'paisModal', art:1, pais:['ES','v2'] },

  // Versiones gris. Comparten la MISMA clave (paisModal) que las de arriba, asi
  // que al guardar se aplica la ultima que abras.
  // OJO: el V2 gris es YA el marco por defecto del cartel (lo eligio David, y lo
  // llevan tambien CHOOSE HOW TO PLAY / SELECT A ROOM / SETTINGS), asi que esta
  // entrada se ve igual que 'SKIN · descripcion'. Sirve para volver a el despues
  // de haber guardado el V3.
  { g:'GRIS', n:'SKIN · descripcion V2 gris', sup:'paisModal', art:1, pais:['ES','v2g'] },
  { g:'GRIS', n:'SKIN · descripcion V3 gris', sup:'paisModal', art:1, pais:['ES','v3g'] },

  { g:'Menu', n:'CHOOSE HOW TO PLAY', sup:'playChoiceModal', art:0, show:'playChoiceModal' },
  { g:'Menu', n:'SELECT A ROOM',      sup:'roomChoiceModal', art:1, show:'roomChoiceModal' },
  { g:'Menu', n:'SETTINGS',           sup:'settingsModal',   art:0, show:'settingsModal' },
  { g:'Menu', n:'FEATURES',           sup:'featuresModal',   art:0, show:'featuresModal' },
];

// Las piezas de cada cartel las decide el juego (cartelPartesDe): title/desc/
// actions por defecto, y las que declare en CARTEL_SURFACES.partes — el de fin
// de partida ademas parte los botones en tres.
const ETIQUETA = { title: 'TITULO', desc: 'TEXTO', actions: 'BOTONES',
                   tryAgain: 'TRY AGAIN', spectate: 'SPECTATE', backToMenu: 'BACK TO MENU',
                   share: 'SHARE', continuar: 'CONTINUE',
                   crece: 'PILDORAS', pie: 'PIE' };
const partesDe = sup => W().cartelPartesDe(W().CARTEL_SURFACES[sup]);
const OCULTABLES = ['sysModal','exitModal','resultOverlay','prizeModal','skillChoiceOverlay',
                    'gameDepositModal','gameWithdrawModal','walletPickerModal','playChoiceModal',
                    'roomChoiceModal','settingsModal','featuresModal','paisModal'];
const CLAVE_POS = 'pw_carteles_editor_pos';

/*
 * Clave de guardado de un cartel. Varios carteles comparten el mismo DOM (los
 * 13 avisos son el mismo #sysModal; GAME OVER y MATCH FINISHED el mismo
 * #resultTitle), pero cada uno se afina POR SEPARADO — de ahi 'modal#variante'.
 * El juego resuelve la misma clave al pintar: showSystemMsg por su titulo y
 * setOverlayTitle por su id.
 */
function claveDe(c) {
  if (c.sys)   return 'sysModal#' + c.sys[1];
  if (c.res)   return 'resultOverlay#' + c.res[0];
  if (c.prize) return 'prizeModal#' + (c.prize.reason === 'arcadeEnd' ? 'matchEnded' : c.prize.reason);
  if (c.exit)  return 'exitModal#' + c.exit[1];
  return c.sup;
}

const LAYOUT = {};              // clave de cartel -> {parte: {x,y,s}}   (esto SI va al juego)
const POS = JSON.parse(localStorage.getItem(CLAVE_POS) || '{}');  // ficha -> {x,y} (solo editor)
const ABIERTOS = new Map();     // indice de CASOS -> elemento ficha
const frame = document.getElementById('game');
const W = () => frame.contentWindow;
let layer = null;

function estado(txt, color) {
  const e = document.getElementById('estado');
  e.textContent = txt; e.style.color = color || '#7d8a84';
}
const sucio = () => estado('sin guardar', '#ffce3d');

// --- La capa del editor, dentro del iframe ------------------------------
function crearCapa() {
  const d = W().document;
  const css = d.createElement('style');
  css.textContent = `
    #ceLayer{position:fixed;inset:0;z-index:99990;background:#0b0f0d;
      background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
      background-size:32px 32px}
    /* Cada overlay del juego pasa a ser un lienzo transparente que NO tapa a los
       demas: asi el CSS del juego (que va scopeado a '#sysModal .exit-box' y
       compania) sigue alcanzando a los clones que cuelgan de el. */
    .ce-host{display:block!important;position:fixed!important;top:0!important;left:0!important;
      width:100%!important;height:100%!important;background:none!important;backdrop-filter:none!important;
      animation:none!important;overflow:visible!important;pointer-events:none!important;z-index:99991!important}
    .ce-ficha{position:absolute;cursor:move;user-select:none;pointer-events:auto}
    .ce-parte{outline:1px dashed rgba(0,255,136,.4);outline-offset:2px;cursor:move}
    .ce-parte:hover{outline:1px solid #00ff88;background:rgba(0,255,136,.06)}
    .ce-parte.sel{outline:1px solid #ffce3d}
    .ce-tag{position:absolute;top:-9px;left:0;font:600 7px/1 monospace;letter-spacing:1px;color:#00ff88;
      background:#0b0f0d;padding:1px 3px;pointer-events:none;opacity:0;transition:.15s}
    .ce-parte:hover .ce-tag{opacity:1}
  `;
  d.head.appendChild(css);
  // El cartel de skin se monta la primera vez que se abre, o sea DESPUES de
  // esta capa, y entonces queda por detras de ella en el orden del documento:
  // querySelector('#paisModal .pm-caja') devolvia el CLON de la ficha anterior
  // en vez del original, y la segunda ficha se comia a la primera. Montandolo
  // ahora queda por delante y cada ficha clona lo suyo.
  try { W().paisModalMontar(); } catch (e) {}
  layer = d.createElement('div');
  layer.id = 'ceLayer';
  d.body.appendChild(layer);
  // Nada de lo que haya dentro de un clon puede ejecutar logica del juego:
  // aqui "volver al menu" o la X de un cartel no deben navegar a ningun sitio.
  ['click', 'submit'].forEach(ev => {
    layer.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }, true);
  });
}

// --- Clonar un cartel ----------------------------------------------------
function clonar(c) {
  const w = W(), d = w.document;
  // 1. Que el juego lo pinte de verdad (arte, clases, textos reales).
  OCULTABLES.forEach(id => { const e = d.getElementById(id); if (e) e.style.display = 'none'; });
  if (c.sys)        w.showSystemMsg(c.sys[0], c.sys[1]);
  else if (c.pais)  w.cartelDevShowPais(c.pais[0], c.pais[1]);
  else if (c.prize) w.cartelDevShowPrize(c.prize);
  else if (c.exit) {
    // Mismo pintado que toggleExitModal(), pero sin sus guardas de estado
    // real (gameRunning, isSpectating, currentGameMode...) — aqui el texto y
    // el titulo (imagen horneada si hay atlas, texto si no) se ponen a mano.
    const [desc, titulo, png, boton] = c.exit;
    const modal = d.getElementById('exitModal');
    const t = d.getElementById('exitModalTitle'), ds = d.getElementById('exitModalDesc'), btn = d.getElementById('btnConfirmExit');
    modal.style.display = 'flex';
    if (png && w.cartelUsesAtlas(png)) {
      // Mismo ancho calculado que usa setTitle() en el juego: si aqui fuera
      // otro, el editor mentiria sobre como se ve el cartel de verdad.
      const ancho = w.cartelTitleFit(png, 26, 324, 92) || '92%';
      t.innerHTML = '<img src="' + w.cartelHeroUrl(png) + '" alt="' + titulo + '" style="display:block;margin:0 auto;width:' + ancho + ';height:auto;image-rendering:pixelated;">';
    } else t.innerText = titulo;
    ds.innerHTML = desc;
    btn.innerText = boton;
  }
  else {
    const e = d.getElementById(c.show);
    if (e) e.style.display = 'flex';
    if (c.res) {
      w.setOverlayTitle(d.getElementById('resultTitle'), c.res[0], c.res[1], c.res[2]);
      // El juego rellena el resultado al acabar la partida y aqui salia vacio:
      // se afinaba el hueco SIN ese texto y luego, en el juego, aparecia en
      // medio de lo ya colocado. Lo pinta el juego con su propia funcion.
      const res = d.getElementById('myResult');
      if (res && c.st) { res.innerHTML = w.cartelDevResultText(c.st); res.style.color = ''; }
      // TRY AGAIN sale en los tres (online y offline).
      const tb = d.getElementById('btnTryAgainOnline');
      if (tb) tb.style.display = 'block';
    }
  }

  const sup = w.CARTEL_SURFACES[c.sup];
  const box = d.querySelector(sup.box);
  if (!box) return null;
  // Medir AHORA, con el cartel puesto por el juego: muchas cajas sacan su
  // tamano del overlay que las centra (ancho en %, flex). Fuera de ahi el clon
  // colapsa o se estira — KICKED pasaba de 518 a 382 px. Se clava en px para
  // que salga exactamente igual que en el juego.
  const medida = box.getBoundingClientRect();

  // 2. Marcar las piezas ANTES de clonar: los selectores de sup[p] son por id
  //    y no sobreviven al clonado tal cual, asi que se localizan aqui y se
  //    marcan con data-ce (eso si persiste en el clon).
  const originales = {};
  for (const p of w.cartelPartesDe(sup)) {
    const el = sup[p] && d.querySelector(sup[p]);
    if (el) { el.setAttribute('data-ce', p); originales[p] = el; }
  }
  const clon = box.cloneNode(true);
  for (const p of Object.keys(originales)) originales[p].removeAttribute('data-ce');

  // 3. Los <canvas> se clonan EN BLANCO (los titulos procedurales son canvas),
  //    hay que repintarlos copiando los pixeles del original.
  const src = box.querySelectorAll('canvas'), dst = clon.querySelectorAll('canvas');
  for (let i = 0; i < dst.length && i < src.length; i++) {
    try {
      dst[i].width = src[i].width; dst[i].height = src[i].height;
      dst[i].getContext('2d').drawImage(src[i], 0, 0);
    } catch (e) {}
  }
  // 4. Fuera handlers inline. Los ids SI se conservan: el pixel-pack tiene
  //    reglas horneadas por id exacto (#btnBackToMenu, #myResult...) y por
  //    ancestro ("#sysModal .exit-box.sys-green", "#prizeModal .gameModalBox"...)
  //    — quitarlos dejaba el cartel sin su arte. Duplicarlos no rompe nada:
  //    el CSS estiliza a todos los que matchean y getElementById() sigue
  //    devolviendo el original porque va antes en el documento que el layer
  //    del editor.
  clon.querySelectorAll('*').forEach(e => {
    for (const a of [...e.attributes]) if (a.name.startsWith('on')) e.removeAttribute(a.name);
  });
  // El clon deja de depender de donde lo pusiera el CSS del overlay, pero
  // conserva su tamano exacto. overflow visible para que una pieza escalada
  // hacia fuera se siga viendo entera.
  clon.style.setProperty('position', 'static', 'important');
  clon.style.setProperty('margin', '0', 'important');
  clon.style.setProperty('transform', 'none', 'important');
  // border-box porque la medida viene de getBoundingClientRect (incluye padding
  // y borde) y varias de estas cajas son content-box: sin esto el clon se hace
  // el doble del padding mas grande.
  clon.style.setProperty('box-sizing', 'border-box', 'important');
  clon.style.setProperty('width', Math.round(medida.width) + 'px', 'important');
  clon.style.setProperty('height', Math.round(medida.height) + 'px', 'important');
  clon.style.setProperty('max-width', 'none', 'important');
  clon.style.setProperty('min-width', '0', 'important');
  clon.style.setProperty('flex', 'none', 'important');
  clon.style.setProperty('overflow', 'visible', 'important');

  OCULTABLES.forEach(id => { const e = d.getElementById(id); if (e) e.style.display = 'none'; });

  // El envoltorio hereda el id del modal (#sysModal, #prizeModal, #gameDepositModal...)
  // para que las reglas "#modal .caja..." del pixel-pack sigan encontrando un
  // ancestro con ese id, aunque el clon ya no cuelgue del modal real. Pero ese
  // mismo id tambien trae el CSS base del propio overlay (pantalla completa,
  // fondo negro, backdrop-filter) — hay que anularlo o cada cartel abierto
  // tapa la pantalla entera de negro. Solo queremos el id, no su aspecto.
  const host = d.createElement('div');
  host.id = c.sup;
  host.style.cssText = 'all:unset;display:block!important;position:static!important;' +
    'width:auto!important;height:auto!important;max-width:none!important;max-height:none!important;' +
    'margin:0!important;padding:0!important;background:none!important;backdrop-filter:none!important;' +
    '-webkit-backdrop-filter:none!important;animation:none!important;transform:none!important;z-index:auto!important;';
  host.appendChild(clon);
  return host;
}

// --- Abrir / cerrar ------------------------------------------------------
function abrir(i) {
  const c = CASOS[i], d = W().document;
  const clon = clonar(c);
  if (!clon) { estado('no se pudo abrir ' + c.n, '#ff5b5b'); return; }

  // El cartel y nada mas: se arrastra agarrandolo por cualquier hueco suyo que
  // no sea una pieza (esas se mueven solas). Para cerrarlo, su boton en la lista.
  const ficha = d.createElement('div');
  ficha.className = 'ce-ficha';
  ficha.appendChild(clon);

  const p = POS[c.n] || { x: 30 + (ABIERTOS.size % 3) * 340, y: 30 + Math.floor(ABIERTOS.size / 3) * 300 };
  ficha.style.left = p.x + 'px'; ficha.style.top = p.y + 'px';
  layer.appendChild(ficha);
  ABIERTOS.set(i, ficha);
  CASOS[i].btn.classList.add('on');

  arrastrarFicha(ficha, c.n);
  prepararPiezas(ficha, claveDe(c), c.sup);
  aplicar(claveDe(c));

  // Cartel de skin: las dos fichas (gris y V2 verde) comparten clave, asi que
  // el marco no se puede deducir de ella. Manda el ULTIMO que se abre, y eso es
  // lo que se guarda — abre el que quieras dejar puesto y dale a GUARDAR.
  if (c.pais) {
    LAYOUT.paisModal = LAYOUT.paisModal || {};
    LAYOUT.paisModal.variante = c.pais[1] || '';
    estado('marco del cartel de skin: ' + (c.pais[1] === 'v2' ? 'VERDE (V2)' : 'GRIS') + ' — sin guardar', '#ffce3d');
  }
}

function cerrar(i) {
  const f = ABIERTOS.get(i);
  if (f) f.remove();
  ABIERTOS.delete(i);
  CASOS[i].btn.classList.remove('on');
}
function cerrarTodos() { [...ABIERTOS.keys()].forEach(cerrar); }

// --- Mover la ficha entera por el lienzo (solo editor) -------------------
function arrastrarFicha(ficha, clave) {
  // Sin capturar: las piezas paran la propagacion en su propio mousedown, asi
  // que aqui solo llegan los clicks en el hueco libre del cartel.
  ficha.addEventListener('mousedown', e => {
    e.preventDefault(); e.stopPropagation();
    const x0 = e.clientX, y0 = e.clientY;
    const l0 = parseFloat(ficha.style.left) || 0, t0 = parseFloat(ficha.style.top) || 0;
    const d = W().document;
    const mover = ev => { ficha.style.left = (l0 + ev.clientX - x0) + 'px'; ficha.style.top = (t0 + ev.clientY - y0) + 'px'; };
    const soltar = () => {
      d.removeEventListener('mousemove', mover); d.removeEventListener('mouseup', soltar);
      POS[clave] = { x: parseFloat(ficha.style.left) || 0, y: parseFloat(ficha.style.top) || 0 };
      localStorage.setItem(CLAVE_POS, JSON.stringify(POS));
    };
    d.addEventListener('mousemove', mover); d.addEventListener('mouseup', soltar);
  });
}

// --- Mover / escalar cada pieza (esto SI va al juego) --------------------
function valor(clave, parte) {
  const v = (LAYOUT[clave] = LAYOUT[clave] || {});
  return (v[parte] = v[parte] || { x: 0, y: 0, s: 1 });
}

// Repinta solo la ficha de ese cartel: cada uno lleva su propio ajuste aunque
// comparta el DOM con otros.
function aplicar(clave) {
  for (const [i, ficha] of ABIERTOS) {
    if (claveDe(CASOS[i]) !== clave) continue;
    for (const p of partesDe(CASOS[i].sup)) {
      const el = ficha.querySelector('[data-ce="' + p + '"]');
      if (!el) continue;
      const t = (LAYOUT[clave] || {})[p];
      if (!t) { el.style.removeProperty('transform'); continue; }
      el.style.setProperty('transform', 'translate(' + t.x + 'px,' + t.y + 'px) scale(' + t.s + ')', 'important');
      el.style.setProperty('transform-origin', 'center', 'important');
    }
  }
}

function prepararPiezas(ficha, clave, sup) {
  const d = W().document;
  for (const p of partesDe(sup)) {
    const el = ficha.querySelector('[data-ce="' + p + '"]');
    if (!el) continue;
    el.classList.add('ce-parte');
    const tag = d.createElement('span');
    tag.className = 'ce-tag'; tag.textContent = ETIQUETA[p];
    el.appendChild(tag);

    el.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation();
      const v = valor(clave, p), x0 = e.clientX, y0 = e.clientY, vx = v.x, vy = v.y;
      const mover = ev => { v.x = Math.round(vx + ev.clientX - x0); v.y = Math.round(vy + ev.clientY - y0); aplicar(clave); };
      const soltar = () => { d.removeEventListener('mousemove', mover); d.removeEventListener('mouseup', soltar); sucio(); };
      d.addEventListener('mousemove', mover); d.addEventListener('mouseup', soltar);
    });

    el.addEventListener('wheel', e => {
      e.preventDefault(); e.stopPropagation();
      const v = valor(clave, p);
      v.s = Math.max(0.2, Math.min(5, Math.round((v.s + (e.deltaY < 0 ? 0.05 : -0.05)) * 100) / 100));
      aplicar(clave); sucio();
    }, { passive: false });

    el.addEventListener('dblclick', e => {
      e.preventDefault(); e.stopPropagation();
      if (LAYOUT[clave]) delete LAYOUT[clave][p];
      aplicar(clave); sucio();
    });
  }
}

// --- Guardar / reset -----------------------------------------------------
async function guardar() {
  estado('guardando...', '#9fb0a8');
  try {
    const r = await fetch('/api/carteles-layout', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ layout: LAYOUT, key: ADMIN_KEY }),
    });
    const j = await r.json();
    if (!j.ok) {
      if (r.status === 403) {
        // Clave incorrecta: se pide de nuevo, no se pierde el layout en memoria.
        document.getElementById('asideApp').style.display = 'none';
        document.getElementById('mainApp').style.display = 'none';
        document.getElementById('loginError').textContent = 'Clave incorrecta';
        document.getElementById('adminKeyInput').value = '';
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('adminKeyInput').focus();
      }
      throw new Error(j.error || 'error');
    }
    estado('guardado en el servidor (' + j.count + ' carteles) — aguanta las actualizaciones', '#00ff88');
  } catch (e) { estado('no se pudo guardar: ' + e.message, '#ff5b5b'); }
}

function resetTodo() {
  for (const k of Object.keys(LAYOUT)) delete LAYOUT[k];
  new Set([...ABIERTOS.keys()].map(i => claveDe(CASOS[i]))).forEach(aplicar);
  sucio();
}

// --- Barra lateral -------------------------------------------------------
(function construirLista() {
  const cont = document.getElementById('lista');
  let grupo = null;
  CASOS.forEach((c, i) => {
    if (c.g !== grupo) { grupo = c.g; const h = document.createElement('h2'); h.textContent = grupo; cont.appendChild(h); }
    const b = document.createElement('button');
    b.className = 't';
    b.innerHTML = '<span class="dot ' + (c.art ? 'ok' : 'no') + '"></span>' + c.n;
    b.onclick = () => (ABIERTOS.has(i) ? cerrar(i) : abrir(i));
    c.btn = b; cont.appendChild(b);
  });
})();

frame.addEventListener('load', () => {
  // El juego ya no pide el arte de los carteles al arrancar (carga diferida,
  // ver game/cartel-hero.js): la dispara al elegir modo o a los 10s. Aqui hace
  // falta YA, o el editor se queda 10 segundos en "cargando".
  if (typeof W().cartelHeroLoad === 'function') W().cartelHeroLoad();
  W().CARTELES_READY.then(guardado => {
    Object.assign(LAYOUT, JSON.parse(JSON.stringify(guardado || {})));
    crearCapa();
    abrir(7);   // KICKED de arranque, para no empezar con el lienzo vacio
    estado('listo');
  });
});
</script>
