<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PillWars — carteles y pop-ups</title>
<style>
  :root { --ok:#00ff88; --no:#ff5b5b; --line:#233029; }
  * { box-sizing: border-box; }
  body { margin:0; background:#0b0f0d; color:#dfe6e2; font:13px/1.5 system-ui,sans-serif; display:flex; height:100vh; overflow:hidden; }

  aside { width:270px; flex:none; background:#0f1512; border-right:1px solid var(--line); padding:14px; overflow-y:auto; }
  h1 { font-size:14px; margin:0 0 3px; letter-spacing:1px; }
  p.sub { font-size:11px; color:#7d8a84; margin:0 0 14px; }
  h2 { font-size:10px; text-transform:uppercase; letter-spacing:2px; color:#7d8a84; margin:16px 0 7px; border-bottom:1px solid var(--line); padding-bottom:4px; }
  button.t { display:block; width:100%; text-align:left; margin:0 0 4px; padding:7px 9px; border:1px solid #2a3a33;
             background:#141b18; color:#dfe6e2; font:600 11px/1.25 monospace; letter-spacing:.4px; cursor:pointer; border-radius:3px; }
  button.t:hover { border-color:#3d5b4e; background:#1a2420; }
  button.t.on { border-color:var(--ok); background:#12251c; color:var(--ok); }
  .dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:6px; vertical-align:1px; }
  .dot.no { background:var(--no); } .dot.ok { background:var(--ok); }

  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .bar { padding:8px 14px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:11px; color:#9fb0a8; }
  .bar b { color:#dfe6e2; font:600 12px monospace; letter-spacing:1px; }
  .tag { border:1px solid #2a3a33; border-radius:3px; padding:1px 6px; font-size:10px; }
  .stage { flex:1; position:relative; overflow:hidden; background:#000; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }

  .edit { flex:none; border-top:1px solid var(--line); background:#0f1512; padding:10px 14px 12px; }
  .rows { display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:5px 18px; }
  .row { display:flex; align-items:center; gap:8px; }
  .row label { width:96px; flex:none; font-size:11px; color:#9fb0a8; }
  .row input[type=range] { flex:1; min-width:60px; accent-color:var(--ok); }
  .row output { width:42px; flex:none; text-align:right; font:600 11px monospace; color:var(--ok); }
  .row.off { opacity:.32; pointer-events:none; }
  .acts { display:flex; gap:8px; margin-top:10px; align-items:center; }
  .acts button { padding:6px 14px; border:1px solid #2a3a33; background:#141b18; color:#dfe6e2; font:600 11px monospace;
                 letter-spacing:1px; cursor:pointer; border-radius:3px; }
  .acts button.save { border-color:var(--ok); color:var(--ok); }
  .acts button.save:hover { background:#12251c; }
  .acts button:hover { border-color:#3d5b4e; }
  #estado { font-size:11px; color:#7d8a84; }
</style>
</head>
<body>
<aside>
  <h1>Carteles y pop-ups</h1>
  <p class="sub">Render real: el juego corre en el iframe.<br>Los sliders lo modifican en vivo.</p>
  <div id="lista"></div>
</aside>

<main>
  <div class="bar">
    <b id="curTitle">—</b>
    <span class="tag" id="tagArt">—</span>
    <span class="tag" id="tagFrame">—</span>
    <span class="tag" id="tagW">—</span>
  </div>
  <div class="stage"><iframe id="game" src="game/index.html"></iframe></div>
  <div class="edit">
    <div class="rows" id="sliders"></div>
    <div class="acts">
      <button class="save" onclick="guardar()">GUARDAR EN EL JUEGO</button>
      <button onclick="resetActual()">RESET ESTE</button>
      <button onclick="resetTodo()">RESET TODO</button>
      <span id="estado">↑↓ para cambiar de cartel</span>
    </div>
  </div>
</main>

<script>
/*
 * Editor de espaciado de los carteles. Los valores viven en LAYOUT (keyed por
 * superficie, las de game/carteles-layout.js) y se aplican en vivo llamando a
 * applyCartelSurface() DENTRO del iframe, que es donde estan los elementos.
 * GUARDAR los manda a POST /api/carteles-layout, que escribe
 * game/carteles-layout.json — un fichero del repo, asi que va en el commit.
 */

// Cada entrada = un cartel concreto que se puede mostrar. `sup` es la clave de
// superficie (varias entradas pueden compartirla: los 13 avisos de sistema son
// todos 'sysModal'), `art` marca si el titulo ya tiene PNG horneado.
const CASOS = [
  // --- Avisos de sistema -------------------------------------------------
  { g:'Sistema · avisos', n:'NOTICE',               sup:'sysModal', art:0, sys:['Something happened. This is the default system notice.','NOTICE'] },
  { g:'Sistema · avisos', n:'WITHDRAW FAILED',      sup:'sysModal', art:0, sys:['You only have 12,500 $PILL in GAME. Lower the amount.','WITHDRAW FAILED'] },
  { g:'Sistema · avisos', n:'WITHDRAW COMPLETE',    sup:'sysModal', art:0, sys:['40,000 $PILL sent back to your wallet.','WITHDRAW COMPLETE'] },
  { g:'Sistema · avisos', n:'DEPOSIT COMPLETE',     sup:'sysModal', art:0, sys:['50,000 $PILL added to your in-GAME balance.','DEPOSIT COMPLETE'] },
  { g:'Sistema · avisos', n:'INSUFFICIENT BALANCE', sup:'sysModal', art:0, sys:['Not enough in-GAME balance. Entry costs 50,000 $PILL and you have 12,500. Use the DEPOSIT button to add more.','INSUFFICIENT BALANCE'] },
  { g:'Sistema · avisos', n:'CONNECTION FAILED',    sup:'sysModal', art:0, sys:["Couldn't connect to the server. Please try again in a moment.",'CONNECTION FAILED'] },
  { g:'Sistema · avisos', n:'WALLET',               sup:'sysModal', art:0, sys:['Wallet module not loaded yet.','WALLET'] },
  { g:'Sistema · avisos', n:'KICKED',               sup:'sysModal', art:1, sys:['You were kicked. Wait 30 seconds before rejoining.','KICKED'] },
  { g:'Sistema · avisos', n:'REJOIN EXPIRED',       sup:'sysModal', art:1, sys:['The rejoin window has closed. Your slot was released and you need to enter again.','REJOIN EXPIRED'] },
  { g:'Sistema · avisos', n:'WALLET REQUIRED',      sup:'sysModal', art:1, sys:['Connect your wallet first on the home page, then come back to play paid rooms.','WALLET REQUIRED'] },
  { g:'Sistema · avisos', n:'CONNECT ERROR',        sup:'sysModal', art:1, sys:['Phantom is not installed. Install it or pick another wallet.','CONNECT ERROR'] },
  { g:'Sistema · avisos', n:'DEPOSIT FAILED',       sup:'sysModal', art:1, sys:['You only have 8,000 $PILL in your wallet. Lower the amount.','DEPOSIT FAILED'] },
  { g:'Sistema · avisos', n:'PAYMENT CANCELLED',    sup:'sysModal', art:1, sys:['You must sign the entry payment to join a paid room.','PAYMENT CANCELLED'] },
  { g:'Sistema · avisos', n:'LEAVE ARENA?',         sup:'exitModal', art:0, show:'exitModal' },

  // --- Fin de partida ----------------------------------------------------
  { g:'Fin de partida', n:'GAME OVER',      sup:'resultOverlay', art:1, show:'resultOverlay', res:['gameOver','GAME OVER','#ff2a2a'] },
  { g:'Fin de partida', n:'MATCH FINISHED', sup:'resultOverlay', art:1, show:'resultOverlay', res:['matchFinished','MATCH FINISHED','#00ff88'] },
  { g:'Fin de partida', n:'ROOM RESTARTED', sup:'resultOverlay', art:1, show:'resultOverlay', res:['roomRestarted','ROOM RESTARTED','#ffcc00'] },
  { g:'Fin de partida', n:'VICTORY!',       sup:'prizeModal', art:1, prize:{ reason:'victory',  amount:250000, carry:180000 } },
  { g:'Fin de partida', n:'CASHOUT',        sup:'prizeModal', art:1, prize:{ reason:'cashout',  amount:40000,  carry:50000  } },
  { g:'Fin de partida', n:'MATCH ENDED (arcade)', sup:'prizeModal', art:1, prize:{ reason:'arcadeEnd', amount:120000, carry:90000 } },
  { g:'Fin de partida', n:'SELECT A SKILL', sup:'skillChoiceOverlay', art:0, show:'skillChoiceOverlay' },

  // --- Wallet ------------------------------------------------------------
  { g:'Wallet', n:'DEPOSIT',        sup:'gameDepositModal',  art:0, show:'gameDepositModal' },
  { g:'Wallet', n:'WITHDRAW',       sup:'gameWithdrawModal', art:0, show:'gameWithdrawModal' },
  { g:'Wallet', n:'CONNECT WALLET', sup:'walletPickerModal', art:1, show:'walletPickerModal' },

  // --- Menu --------------------------------------------------------------
  { g:'Menu', n:'CHOOSE HOW TO PLAY', sup:'playChoiceModal', art:0, show:'playChoiceModal' },
  { g:'Menu', n:'SELECT A ROOM',      sup:'roomChoiceModal', art:1, show:'roomChoiceModal' },
  { g:'Menu', n:'SETTINGS',           sup:'settingsModal',   art:0, show:'settingsModal' },
  { g:'Menu', n:'FEATURES',           sup:'featuresModal',   art:0, show:'featuresModal' },
];

// Sliders: prop -> [etiqueta, min, max]. Coinciden con las props saneadas por
// el endpoint (server/index.js, /api/carteles-layout).
const PROPS = {
  padT:     ['Padding arriba', 0, 120],
  padB:     ['Padding abajo',  0, 120],
  padX:     ['Padding lados',  0, 120],
  gapTitle: ['Titulo → texto', 0, 80],
  gapText:  ['Texto → botones',0, 80],
  fontSize: ['Tamano texto',   6, 32],
  titleW:   ['Ancho titulo %', 10, 100],
};

const OCULTABLES = ['sysModal','exitModal','resultOverlay','prizeModal','skillChoiceOverlay',
                    'gameDepositModal','gameWithdrawModal','walletPickerModal','playChoiceModal',
                    'roomChoiceModal','settingsModal','featuresModal'];

const LAYOUT = {};            // superficie -> {prop: valor}
let actual = 0, listo = false;
const frame = document.getElementById('game');
const W = () => frame.contentWindow;

// --- Mostrar un cartel en el iframe -------------------------------------
function mostrar(c) {
  const w = W(), d = w.document;
  OCULTABLES.forEach(id => { const e = d.getElementById(id); if (e) e.style.display = 'none'; });
  if (c.sys)        w.showSystemMsg(c.sys[0], c.sys[1]);
  else if (c.prize) w.cartelDevShowPrize(c.prize);
  else {
    const e = d.getElementById(c.show);
    if (e) e.style.display = 'flex';
    // GAME OVER / MATCH FINISHED / ROOM RESTARTED comparten #resultTitle: se
    // pinta con la misma funcion que usa el juego, para ver el arte real.
    if (c.res) w.setOverlayTitle(d.getElementById('resultTitle'), c.res[0], c.res[1], c.res[2]);
  }
}

// --- Info leida del DOM real --------------------------------------------
function refrescarInfo(c) {
  const w = W(), d = w.document;
  const sup = w.CARTEL_SURFACES[c.sup];
  const box = sup && d.querySelector(sup.box);
  const tEl = sup && sup.title && d.querySelector(sup.title);
  const img = tEl && (tEl.tagName === 'IMG' ? tEl : tEl.querySelector('img'));
  const bg = box ? (w.getComputedStyle(box).backgroundImage || '').match(/cartel-hero\/([\w-]+)\.png/) : null;
  document.getElementById('curTitle').textContent = c.n;
  document.getElementById('tagArt').textContent   = img ? 'titulo: ' + img.src.split('/').pop() : 'titulo: fuente/texto';
  document.getElementById('tagFrame').textContent = 'marco: ' + (bg ? bg[1] + '.png' : 'procedural');
  document.getElementById('tagW').textContent     = box ? 'caja: ' + Math.round(box.getBoundingClientRect().width) + 'px' : 'caja: —';
}

// --- Sliders -------------------------------------------------------------
function construirSliders() {
  const cont = document.getElementById('sliders');
  cont.innerHTML = '';
  for (const p of Object.keys(PROPS)) {
    const [lab, min, max] = PROPS[p];
    const row = document.createElement('div');
    row.className = 'row'; row.dataset.prop = p;
    row.innerHTML = '<label>' + lab + '</label>' +
      '<input type="range" min="' + min + '" max="' + max + '" step="1">' +
      '<output>—</output>';
    const inp = row.querySelector('input'), out = row.querySelector('output');
    inp.oninput = () => {
      out.textContent = inp.value;
      const sup = CASOS[actual].sup;
      (LAYOUT[sup] = LAYOUT[sup] || {})[p] = +inp.value;
      W().applyCartelSurface(sup, LAYOUT[sup]);
      if (CASOS[actual].sys) mostrar(CASOS[actual]);   // el titulo del sysModal se repinta en cada llamada
      refrescarInfo(CASOS[actual]);
      estado('sin guardar', '#ffce3d');
    };
    cont.appendChild(row);
  }
}

// Rellena los sliders con lo que hay: el valor guardado si existe, y si no el
// valor real que tiene ahora mismo el elemento (para partir de lo de fabrica).
function sincronizarSliders(c) {
  const w = W(), d = w.document, sup = w.CARTEL_SURFACES[c.sup];
  const box = sup && d.querySelector(sup.box);
  const tEl = sup && sup.title && d.querySelector(sup.title);
  const dEl = sup && sup.desc && d.querySelector(sup.desc);
  const img = tEl && (tEl.tagName === 'IMG' ? tEl : tEl.querySelector('img'));
  const v = LAYOUT[c.sup] || {};
  const px = (el, prop) => (el ? Math.round(parseFloat(w.getComputedStyle(el)[prop]) || 0) : null);
  const real = {
    padT: px(box, 'paddingTop'), padB: px(box, 'paddingBottom'), padX: px(box, 'paddingLeft'),
    gapTitle: px(tEl, 'marginBottom'), gapText: px(dEl, 'marginBottom'), fontSize: px(dEl, 'fontSize'),
    titleW: img && box ? Math.round(img.getBoundingClientRect().width / box.getBoundingClientRect().width * 100) : null,
  };
  document.querySelectorAll('.row').forEach(row => {
    const p = row.dataset.prop, inp = row.querySelector('input'), out = row.querySelector('output');
    const disponible = real[p] != null && (p !== 'titleW' || !!img);
    row.classList.toggle('off', !disponible);
    const val = v[p] != null ? v[p] : real[p];
    if (val == null) { out.textContent = 'n/a'; return; }
    inp.value = val; out.textContent = val;
  });
}

function pinta() {
  if (!listo) return;
  CASOS.forEach((c, i) => c.btn.classList.toggle('on', i === actual));
  const c = CASOS[actual];
  mostrar(c);
  refrescarInfo(c);
  sincronizarSliders(c);
}

function estado(txt, color) {
  const e = document.getElementById('estado');
  e.textContent = txt; e.style.color = color || '#7d8a84';
}

// --- Guardar / reset -----------------------------------------------------
async function guardar() {
  estado('guardando...', '#9fb0a8');
  try {
    const r = await fetch('/api/carteles-layout', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ layout: LAYOUT }),
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'error');
    estado('guardado en game/carteles-layout.json (' + j.count + ' carteles) — commitea para subirlo', '#00ff88');
  } catch (e) {
    estado('no se pudo guardar: ' + e.message, '#ff5b5b');
  }
}

function resetActual() {
  delete LAYOUT[CASOS[actual].sup];
  frame.contentWindow.location.reload();
  estado('recargando...', '#9fb0a8');
}
function resetTodo() {
  for (const k of Object.keys(LAYOUT)) delete LAYOUT[k];
  frame.contentWindow.location.reload();
  estado('recargando...', '#9fb0a8');
}

// --- Barra lateral -------------------------------------------------------
(function construirLista() {
  const cont = document.getElementById('lista');
  let grupo = null;
  CASOS.forEach((c, i) => {
    if (c.g !== grupo) { grupo = c.g; const h = document.createElement('h2'); h.textContent = grupo; cont.appendChild(h); }
    const b = document.createElement('button');
    b.className = 't';
    b.innerHTML = '<span class="dot ' + (c.art ? 'ok' : 'no') + '"></span>' + c.n;
    b.onclick = () => { actual = i; pinta(); };
    c.btn = b; cont.appendChild(b);
  });
})();
construirSliders();

frame.addEventListener('load', () => {
  // CARTELES_READY = atlas de carteles cargado + carteles-layout.json leido.
  W().CARTELES_READY.then(guardado => {
    Object.assign(LAYOUT, guardado || {});
    listo = true;
    pinta();
    estado('↑↓ para cambiar de cartel');
  });
});

addEventListener('keydown', e => {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  if (e.target.tagName === 'INPUT') return;
  e.preventDefault();
  actual = (actual + (e.key === 'ArrowDown' ? 1 : CASOS.length - 1)) % CASOS.length;
  pinta();
});
</script>
</body>
</html>
